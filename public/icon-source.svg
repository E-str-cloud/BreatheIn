<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App icon: the action screen's overlapping pastel rings on Warm White, kept inside the maskable safe zone. -->
  <defs>
    <radialGradient id="glow-mint" cx="15%" cy="10%" r="60%">
      <stop offset="0" stop-color="#C8F9D9" stop-opacity="0.6" />
      <stop offset="1" stop-color="#C8F9D9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-blush" cx="90%" cy="85%" r="55%">
      <stop offset="0" stop-color="#F7D2E9" stop-opacity="0.5" />
      <stop offset="1" stop-color="#F7D2E9" stop-opacity="0" />
    </radialGradient>
    <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#4B5563" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="#FAF9F6" />
  <rect width="512" height="512" fill="url(#glow-mint)" />
  <rect width="512" height="512" fill="url(#glow-blush)" />

  <circle cx="256" cy="196" r="112" fill="#E7DDF7" fill-opacity="0.9" />
  <circle cx="204" cy="286" r="112" fill="#C8F9D9" fill-opacity="0.8" />
  <circle cx="308" cy="286" r="112" fill="#F7D2E9" fill-opacity="0.75" />
  <circle cx="256" cy="256" r="112" fill="#E7F8A7" fill-opacity="0.25" />

  <circle cx="256" cy="256" r="50" fill="#FFFFFF" filter="url(#soft-shadow)" />
</svg>
